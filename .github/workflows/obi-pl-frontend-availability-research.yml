name: OBI PL frontend availability research

on:
  workflow_dispatch:
    inputs:
      obiks:
        description: Comma-separated known seven-digit OBIKs
        required: true
        default: "3496072,6743009,7156243"
      stores:
        description: Comma-separated three-digit stores
        required: true
        default: "075,074,078"
  push:
    branches:
      - research/obi-pl-frontend-availability-contract

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OBIKS: \${{ inputs.obiks || '3496072,6743009,7156243' }}
      STORES: \${{ inputs.stores || '075,074,078' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic research tests
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile tools/obi_frontend_availability_probe.py
          python -m unittest tools/test_obi_frontend_availability_probe.py

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: Capture real OBI frontend availability flow
        run: |
          set -euo pipefail
          mkdir -p build/obi-frontend-availability
          PYTHONPATH=tools python tools/obi_frontend_availability_probe.py \
            --obiks "$OBIKS" \
            --stores "$STORES" \
            --out build/obi-frontend-availability/summary.json

      - name: Upload sanitized research summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obi-pl-frontend-availability-safe-summary
          path: build/obi-frontend-availability/summary.json
          if-no-files-found: warn
          retention-days: 3

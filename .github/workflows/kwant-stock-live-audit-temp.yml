name: TEMP KWANT selected branch stock audit

on:
  push:
    branches:
      - codex/kwant-selected-branch-stock

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe raw Android-like product response
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import json
          import re
          from urllib.parse import quote, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          origin = "https://kwant.net.pl"
          product_id = "580"
          branch = {
              "department_stock_id": 205,
              "department_stock_name": "Nowy Sącz",
              "department_stock_postcode": "33-300",
              "department_stock_street": "Tarnowska 149",
          }
          cookie_json = json.dumps(
              branch,
              ensure_ascii=False,
              separators=(",", ":"),
          )
          cookie = "departmentCookie=" + quote(cookie_json, safe="")

          class Recorder(HTTPRedirectHandler):
              def __init__(self):
                  super().__init__()
                  self.redirects = []
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.redirects.append({
                      "code": code,
                      "from": urlsplit(req.full_url).path,
                      "to": urlsplit(newurl).path,
                  })
                  return super().redirect_request(
                      req, fp, code, msg, headers, newurl
                  )

          recorder = Recorder()
          opener = build_opener(recorder)
          request = Request(
              origin + "/produkt/" + product_id,
              headers={
                  "User-Agent": "okhttp/4.12.0",
                  "Cookie": cookie,
              },
              method="GET",
          )
          with opener.open(request, timeout=30) as response:
              status = int(getattr(response, "status", response.getcode()))
              final_url = response.geturl()
              content_type = response.headers.get("Content-Type", "")
              raw = response.read()
              if response.headers.get("Content-Encoding", "").lower() == "gzip":
                  raw = gzip.decompress(raw)
              html = raw.decode("utf-8", errors="replace")

          print("RAW_HTTP status=%s finalPath=%s contentType=%s redirects=%s" % (
              status,
              urlsplit(final_url).path,
              content_type.split(";", 1)[0],
              recorder.redirects,
          ))
          print("RAW_HTTP size=%d mainCart580=%s branchName=%s availabilityLabel=%s" % (
              len(html),
              "add-to-cart-button-580" in html,
              "Nowy Sącz" in html,
              "Sprawdź stan i kup towar w oddziałach Kwant" in html,
          ))

          next_match = re.search(
              r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',
              html,
              re.I | re.S,
          )
          root = json.loads(next_match.group(1)) if next_match else {}
          page_props = ((root.get("props") or {}).get("pageProps") or {})
          product = page_props.get("product") or {}
          print(
              "NEXT productId=%s centralStock=%s code=%s ean=%s pagePropKeys=%s"
              % (
                  product.get("id"),
                  product.get("stock"),
                  product.get("code"),
                  product.get("ean"),
                  sorted(page_props.keys()),
              )
          )

          def scalar(v):
              return isinstance(v, (str, int, float)) and not isinstance(v, bool)

          branch_paths = []
          stock_objects = []
          def walk(v, path="$"):
              if isinstance(v, dict):
                  rendered = {str(k): val for k, val in v.items() if scalar(val)}
                  joined = " ".join(str(x) for x in rendered.values())
                  if "Nowy Sącz" in joined or str(rendered.get("department_stock_id", "")) == "205":
                      branch_paths.append((path, rendered))
                  stock_keys = [k for k in rendered if "stock" in k.lower()]
                  if stock_keys:
                      stock_objects.append((path, {k: rendered[k] for k in stock_keys}, rendered))
                  for k, child in v.items():
                      walk(child, path + "." + str(k))
              elif isinstance(v, list):
                  for i, child in enumerate(v):
                      walk(child, path + "[" + str(i) + "]")
          walk(page_props)

          print("NEXT branchPaths=%s" % branch_paths[:20])
          print("NEXT stockObjects=%s" % [
              (path, stocks, {k: vals[k] for k in vals if k in (
                  "id", "product_id", "productId", "department_id",
                  "department_stock_id", "name", "code"
              )})
              for path, stocks, vals in stock_objects[:40]
          ])

          markers = [
              "add-to-cart-button-580",
              "w mag. centralnym",
              "w Nowy Sącz",
              "Nowy Sącz: <span>",
              "Centrala: <span>",
          ]
          for marker in markers:
              indexes = [m.start() for m in re.finditer(re.escape(marker), html, re.I)]
              print("RAW marker=%s count=%d indexes=%s" % (
                  marker,
                  len(indexes),
                  indexes[:10],
              ))
              if indexes:
                  i = indexes[0]
                  excerpt = re.sub(r"\s+", " ", html[max(0, i-450):i+900])
                  print("RAW excerpt[%s]=%s" % (marker, excerpt[:1400]))

          branch_stock_patterns = [
              r'([0-9]+)\s*szt\.\s*</div>\s*w\s*Nowy\s+Sącz',
              r'Nowy\s+Sącz\s*:\s*<span[^>]*>\s*([0-9]+)\s*szt',
          ]
          for pattern in branch_stock_patterns:
              found = re.findall(pattern, html, re.I | re.S)
              print("RAW regex=%s matches=%s" % (pattern, found[:20]))
          PY

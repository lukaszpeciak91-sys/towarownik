name: TEMP rich OBI proof

on:
  push:
    branches:
      - feature/richer-obi-facts-v0.1

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect three live OBI product payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/proof
          for obik in 3496072 6743009 7156243; do
            jar="build/proof/cookies-$obik.txt"
            url="https://www.obi.pl/api/disc/store/change?storeNumber=075&redirectUrl=/p/$obik"
            curl --silent --show-error --location --compressed --max-time 30 \
              --cookie-jar "$jar" --cookie "$jar" \
              --user-agent "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36" \
              --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              --header "Accept-Language: pl-PL,pl;q=0.9" \
              --output "build/proof/$obik.html" "$url"
            rm -f "$jar"
          done

          python3 - <<'PY'
          import json, re
          from html.parser import HTMLParser
          from pathlib import Path

          PRODUCTS = ["3496072","6743009","7156243"]
          WRAPPERS={"Ref","ShallowRef"}

          class Extractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False); self.on=False; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="script" and dict(attrs).get("id")=="__NUXT_DATA__": self.on=True
              def handle_endtag(self,tag):
                  if tag.lower()=="script" and self.on: self.on=False
              def handle_data(self,data):
                  if self.on: self.parts.append(data)

          def decode(root):
              if not isinstance(root,list): return root
              def resolve(v, refs=True, visiting=None):
                  visiting=set() if visiting is None else visiting
                  if isinstance(v,dict):
                      return {k:resolve(x,True,visiting) for k,x in v.items()}
                  if isinstance(v,list):
                      if len(v)>=2 and isinstance(v[0],str) and v[0] in WRAPPERS and type(v[1]) is int and 0<=v[1]<len(root) and v[1] not in visiting:
                          visiting.add(v[1]); out=resolve(root[v[1]],False,visiting); visiting.remove(v[1]); return out
                      return [resolve(x,True,visiting) for x in v]
                  if refs and type(v) is int and 0<=v<len(root) and v not in visiting:
                      visiting.add(v); out=resolve(root[v],False,visiting); visiting.remove(v); return out
                  return v
              return resolve(root[0],True,set())

          def objects(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values(): yield from objects(x)
              elif isinstance(v,list):
                  for x in v: yield from objects(x)

          def scalar(v):
              return isinstance(v,(str,int,float,bool)) or v is None

          def dump(v,path,depth=0):
              if depth>5: return
              if isinstance(v,dict):
                  print(f"{path} OBJECT keys={list(v.keys())}")
                  for k,x in v.items():
                      dump(x,f"{path}.{k}",depth+1)
              elif isinstance(v,list):
                  print(f"{path} ARRAY len={len(v)}")
                  for i,x in enumerate(v[:20]):
                      dump(x,f"{path}[{i}]",depth+1)
              elif scalar(v):
                  s=repr(v)
                  if len(s)>260: s=s[:257]+"..."
                  print(f"{path} = {s}")

          for obik in PRODUCTS:
              html=Path(f"build/proof/{obik}.html").read_text(encoding="utf-8",errors="replace")
              ex=Extractor(); ex.feed(html)
              root=json.loads("".join(ex.parts).strip())
              dec=decode(root)
              candidates=[]
              for obj in objects(dec):
                  if any(str(obj.get(k,""))==obik for k in ("skuId","obik","productNumber","articleNumber","sku")):
                      candidates.append(obj)
              print("\n===== OBIK",obik,"matching_objects",len(candidates),"=====")
              for idx,obj in enumerate(candidates[:4]):
                  store=((obj.get("store") or {}).get("information") or {}) if isinstance(obj.get("store"),dict) else {}
                  print("CANDIDATE",idx,"storeId=",store.get("storeId"),"keys=",list(obj.keys()))
                  if str(store.get("storeId") or store.get("storeNumber") or "")=="075":
                      dump(obj,"product")
                      break
          PY

          rm -rf build/proof

name: TEMP rich OBI live validation

on:
  push:
    branches:
      - feature/richer-obi-facts-v0.1

permissions:
  contents: read

jobs:
  live-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch current production-shaped OBI pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/test/resources/obi
          for obik in 3496072 6743009 7156243; do
            jar="$RUNNER_TEMP/cookies-$obik.txt"
            url="https://www.obi.pl/api/disc/store/change?storeNumber=075&redirectUrl=/p/$obik"
            curl --fail --silent --show-error --location --compressed --max-time 30 \
              --cookie-jar "$jar" --cookie "$jar" \
              --user-agent "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36" \
              --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              --header "Accept-Language: pl-PL,pl;q=0.9" \
              --output "app/src/test/resources/obi/live-validation-$obik.html" "$url"
            rm -f "$jar"
          done

      - name: Generate runner-only production parser validation
        shell: bash
        run: |
          cat > app/src/test/java/pl/lukaszpeciak/towarownik/product/LiveRichObiValidationTempTest.kt <<'KOTLIN'
          package pl.lukaszpeciak.towarownik.product

          import java.math.BigDecimal
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNotNull
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class LiveRichObiValidationTempTest {
              private val parser = ObiPayloadParser()

              @Test
              fun liveRichProductsRemainCorrectAndCompact() {
                  validate("3496072", "Dragon Klej uniwersalny Butapren 50 ml", BigDecimal("12.99"), "Dragon", "Butapren", "Pojemność")
                  validate("6743009", "Bosch Wiertarka Easy Impact 600 W", BigDecimal("188"), "Bosch", "600 W", "Moc [W]")
                  validate("7156243", "Oprawa BATTEN LED 30 cm 9W 850 lm 4000K IP20", BigDecimal("23.99"), null, "garażu", "Stopień szczelności")
              }

              private fun validate(
                  obik: String,
                  expectedName: String,
                  expectedPrice: BigDecimal,
                  expectedBrand: String?,
                  descriptionTerm: String,
                  expectedFactLabel: String,
              ) {
                  val html = checkNotNull(
                      javaClass.getResource("/obi/live-validation-" + obik + ".html"),
                  ).readText()
                  val product = parser.parse(
                      html = html,
                      expectedObik = obik,
                      storeNumber = "075",
                  ).getOrThrow()

                  assertEquals(obik, product.obik)
                  assertEquals(expectedName, product.name)
                  assertEquals("075", product.storeNumber)
                  assertNotNull(product.stock)
                  assertTrue(product.stock!! >= 0)
                  assertEquals(0, expectedPrice.compareTo(product.grossPrice))
                  assertEquals(expectedBrand, product.brand)
                  assertTrue(product.shortDescription?.contains(descriptionTerm, ignoreCase = true) == true)
                  assertTrue(product.technicalFacts.any { it.label.equals(expectedFactLabel, ignoreCase = true) })
                  assertTrue(product.brand == null || product.brand!!.length <= 80)
                  assertTrue(product.shortDescription!!.length <= 220)
                  assertTrue(product.technicalFacts.size <= 6)
                  assertTrue(product.technicalFacts.all { it.label.length <= 60 && it.value.length <= 100 })

                  println(
                      "LIVE_RICH_OK obik=" + obik +
                          " name=" + product.name +
                          " store=" + product.storeNumber +
                          " stock=" + product.stock +
                          " price=" + product.grossPrice +
                          " brand=" + (product.brand ?: "none") +
                          " descriptionChars=" + (product.shortDescription?.length ?: 0) +
                          " facts=" + product.technicalFacts.size,
                  )
              }
          }
          KOTLIN

      - name: Validate with production ObiPayloadParser
        run: ./gradlew testDebugUnitTest --tests pl.lukaszpeciak.towarownik.product.LiveRichObiValidationTempTest --info

      - name: Remove live captures
        if: always()
        run: |
          rm -f app/src/test/resources/obi/live-validation-*.html
          rm -f app/src/test/java/pl/lukaszpeciak/towarownik/product/LiveRichObiValidationTempTest.kt

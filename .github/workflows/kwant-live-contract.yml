name: KWANT live contract probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kwant-live-contract.yml'
      - 'tools/kwant_live_contract_probe.py'
      - 'tools/test_kwant_live_contract_probe.py'
  workflow_dispatch:
    inputs:
      product_query:
        description: Product article/catalog query to investigate
        required: true
        default: "MBN116E"
      branch_label:
        description: Public KWANT branch label to select
        required: true
        default: "Nowy Sącz"
      text_query:
        description: Product-name/text query to investigate
        required: true
        default: "wyłącznik nadprądowy B16 Hager"
      numeric_product_id:
        description: Numeric public product ID to verify through /produkt/<id>
        required: true
        default: "580"
      second_numeric_product_id:
        description: Distinct second public numeric product ID
        required: true
        default: "7027"

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'research/kwant-extended-live-contract-20261011')
    runs-on: ubuntu-latest
    env:
      PRODUCT_QUERY: ${{ inputs.product_query || 'MBN116E' }}
      BRANCH_LABEL: ${{ inputs.branch_label || 'Nowy Sącz' }}
      TEXT_QUERY: ${{ inputs.text_query || 'wyłącznik nadprądowy B16 Hager' }}
      NUMERIC_PRODUCT_ID: ${{ inputs.numeric_product_id || '580' }}
      SECOND_NUMERIC_PRODUCT_ID: ${{ inputs.second_numeric_product_id || '7027' }}
    steps:
      - uses: actions/checkout@v4

      - name: Offline safe-contract regression tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 -m unittest tools/test_kwant_live_contract_probe.py -q

      - name: Validate probe inputs
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - "$PRODUCT_QUERY" "$BRANCH_LABEL" "$TEXT_QUERY" "$NUMERIC_PRODUCT_ID" "$SECOND_NUMERIC_PRODUCT_ID" <<'PY'
          import sys
          from kwant_live_contract_probe import validate_inputs

          validate_inputs(sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4])
          validate_inputs(sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[5])
          if sys.argv[4] == sys.argv[5]:
              raise ValueError("Second product ID must be distinct")
          PY

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "playwright==1.63.0"
          python3 -m playwright install --with-deps chromium

      - name: Probe live KWANT frontend contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/kwant_live_contract_probe.py \
            --product-query "$PRODUCT_QUERY" \
            --branch-label "$BRANCH_LABEL" \
            --text-query "$TEXT_QUERY" \
            --numeric-product-id "$NUMERIC_PRODUCT_ID" \
            --second-numeric-product-id "$SECOND_NUMERIC_PRODUCT_ID" \
            --out-dir build/kwant-live-contract

      - name: Print safe contract summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/kwant-live-contract/summary.txt ]]; then
            cat build/kwant-live-contract/summary.txt
          fi

      - name: Upload safe KWANT contract summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwant-live-contract-summary
          path: |
            build/kwant-live-contract/summary.json
            build/kwant-live-contract/summary.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload short-lived raw KWANT page captures
        # PR runs publish only sanitized summary, never raw captures.
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: kwant-live-contract-raw
          path: |
            build/kwant-live-contract/raw/*.html
            build/kwant-live-contract/raw/*.txt
          if-no-files-found: ignore
          retention-days: 1
